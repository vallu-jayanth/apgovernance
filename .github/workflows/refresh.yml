name: Weekly data refresh
on:
  schedule:
    - cron: "30 0 * * 1"   # Mondays 06:00 IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh scripts/refresh.sh
      - name: Commit updated data
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "data-refresh-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
